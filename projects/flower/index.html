<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="用拇指与食指的距离控制一朵花从花苞到盛开的交互实验。"
    />
    <title>指尖生花 · Gesture Bloom</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23d8cba6'/%3E%3Cg fill='none' stroke='%23ece3cf' stroke-width='1.4'%3E%3Cpath d='M16 11c-1-4-4-6-8-6 0 5 3 8 8 8'/%3E%3Cpath d='M21 11c1-4 4-6 8-6 0 5-3 8-8 8'/%3E%3Cpath d='M16 21c-1 4-4 6-8 6 0-5 3-8 8-8'/%3E%3Cpath d='M16 21c1 4 4 6 8 6 0-5-3-8-8-8'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css?v=20261122-3" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <span class="light light-a"></span>
      <span class="light light-b"></span>
      <span class="grain"></span>
    </div>

    <main class="experience">
      <canvas id="flower-canvas" aria-label="由手势控制开合的花朵"></canvas>

      <header class="topbar">
        <a class="brand" href="#" aria-label="指尖生花首页">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="brand-name">指尖生花</span>
        </a>

        <div class="top-actions">
          <button class="text-button" id="demo-button" type="button">
            自动演示
          </button>
          <button class="camera-trigger" id="camera-button" type="button">
            <span class="camera-dot" aria-hidden="true"></span>
            <span id="camera-button-label">开启手势</span>
          </button>
        </div>
      </header>

      <section class="hero-copy" aria-labelledby="page-title">
        <p class="eyebrow">GESTURE STUDY · 01</p>
        <h1 id="page-title">让指尖，<br /><em>唤醒一朵花。</em></h1>
        <p class="lede">
          拇指与食指轻轻分开，花苞便随之舒展。<br />
          距离就是时间，靠近，再让它慢慢合拢。
        </p>
        <p class="mobile-lede">双指分开让花开，收拢让花合。</p>
      </section>

      <aside class="gesture-panel" aria-label="手势识别画面">
        <div class="camera-shell">
          <video id="camera-video" playsinline muted aria-label="摄像头预览"></video>
          <canvas id="hand-overlay" aria-hidden="true"></canvas>
          <div class="camera-placeholder" id="camera-placeholder">
            <span class="hand-glyph" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
            <span>等待你伸出手</span>
          </div>
          <div class="camera-corner camera-corner-tl"></div>
          <div class="camera-corner camera-corner-tr"></div>
          <div class="camera-corner camera-corner-bl"></div>
          <div class="camera-corner camera-corner-br"></div>
        </div>
        <div class="camera-meta">
          <div>
            <span class="status-dot" id="status-dot" aria-hidden="true"></span>
            <span id="hand-status">摄像头未开启</span>
          </div>
          <span class="privacy-note">画面仅在本机处理</span>
        </div>
      </aside>

      <section class="bloom-readout" aria-label="花开进度">
        <div class="readout-head">
          <span id="bloom-phase">花苞</span>
          <span id="bloom-percent">14%</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-fill"></span>
        </div>
        <div class="progress-ticks" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </section>

      <div class="drag-hint" id="drag-hint">
        <span class="drag-line" aria-hidden="true"></span>
        <span>按住画面左右拖动也可以体验</span>
      </div>

      <footer class="footer-note">
        <span>MEDIAPIPE HAND LANDMARKS</span>
        <span class="footer-rule"></span>
        <span>LOCAL VISION</span>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="./app.js?v=20261122-3"></script>
  </body>
</html>
